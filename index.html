<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SRSMMPANEL - Cheapest SMM Panel</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0f172a;color:#fff}header{background:#1e293b;padding:15px 20px;display:flex;justify-content:space-between}.logo{font-size:22px;font-weight:bold;color:#22c55e}.hero{text-align:center;padding:40px 20px}.btn{background:#22c55e;color:#000;padding:12px 25px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}.container{max-width:900px;margin:auto;padding:20px}.card{background:#1e293b;padding:20px;border-radius:12px;margin-bottom:20px}input,select{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff}.service{background:#0f172a;padding:12px;border-radius:8px;border:1px solid #334155;margin:5px 0;cursor:pointer}.service.active{border:2px solid #22c55e}.price{color:#22c55e;font-weight:bold}</style>
</head><body>
<header><div class="logo">SRSMMPANEL</div><div>Balance: <b>Rs 0</b></div></header>
<div class="hero"><h1>Pakistan's Cheapest SMM Panel - 50% Profit Included</h1><p>Instagram • TikTok • YouTube • Facebook - Live Services from FAST SMM STORE</p></div>
<div class="container">
<div class="card"><h3>🛒 New Order - Live Services</h3>
<label>Search Service</label><input id="search" placeholder="Search - Jese Instagram Followers" oninput="filterList()">
<div id="list" style="max-height:300px;overflow:auto"></div>
<label>Link</label><input id="link" placeholder="https://instagram.com/username">
<label>Quantity</label><input id="qty" type="number" value="1000" oninput="calc()">
<p>Total: <b id="total" class="price">Rs 0</b></p>
<button class="btn" style="width:100%" onclick="placeOrder()">Place Order</button><p id="msg"></p></div>
<div class="card"><h3>💰 Add Funds - Easypaisa</h3><input id="amount" type="number" placeholder="Amount - Jese 1000"><button class="btn" style="width:100%;background:#ff00a8;color:#fff" onclick="alert('Easypaisa Auto - Step 5 me connect hoga, abhi manual karo')">Pay with Easypaisa</button></div>
</div>
<script>
let all=[], selected=null;
async function load(){
  document.getElementById('list').innerHTML="Loading services...";
  let r=await fetch('/.netlify/functions/services'); let d=await r.json();
  all=Array.isArray(d)?d:d.services||[];
  selected=all[0]; render(); calc();
}
function render(){
  let q=document.getElementById('search').value.toLowerCase();
  let f=all.filter(s=>s.name.toLowerCase().includes(q)).slice(0,50);
  document.getElementById('list').innerHTML=f.map(s=>`<div class="service ${selected&&s.service==selected.service?'active':''}" onclick='selectService(${s.service})'><b>${s.name}</b><br><span class="price">Rs ${s.rate} / 1000</span> | ID: ${s.service} | Min ${s.min} Max ${s.max}</div>`).join('');
}
function selectService(id){ selected=all.find(s=>s.service==id); render(); calc(); }
function filterList(){ render(); }
function calc(){ if(!selected) return; let q=document.getElementById('qty').value||0; document.getElementById('total').innerText="Rs "+((q/1000)*selected.rate).toFixed(0); }
async function placeOrder(){
  let link=document.getElementById('link').value, qty=document.getElementById('qty').value;
  if(!link) return alert("Link dalo!");
  let r=await fetch('/.netlify/functions/order',{method:'POST',body:JSON.stringify({service:selected.service,link,quantity:qty})});
  let d=await r.json(); document.getElementById('msg').innerText="✅ Order Sent! Order ID: "+(d.order||JSON.stringify(d));
}
load();
</script></body></html>
